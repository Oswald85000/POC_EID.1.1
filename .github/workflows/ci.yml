name: eid_reflex CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get -y install verilator python3
      - name: Generate vectors
        run: make -C eid_reflex_core gen
      - name: Run simulation
        run: make -C eid_reflex_core sim
      - name: Run C reference tests
        run: make -C eid_reflex_core check
