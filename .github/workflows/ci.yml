name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sim: [verilator, iverilog]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y verilator iverilog lcov gtkwave
      - name: Generate vectors
        run: make -C eid_reflex_core gen
      - name: Run simulation
        run: make -C eid_reflex_core SIM=${{ matrix.sim }} sim
      - name: Check C model
        run: make -C eid_reflex_core check
      - name: Coverage
        if: matrix.sim == 'verilator'
        run: make -C eid_reflex_core cov
